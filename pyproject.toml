[project]
name = "uengram"
version = "0.1.0"
description = "Deterministic fixed-budget memory for embedded sensor streams"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kamal Kishor Pandey", email = "kamal.pandey@kepr.dev" }]
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
cnn = ["torch>=2.9,<3"]
baselines = [
    "river>=0.21",
]
laya = ["laya>=0.4.13,<0.5"]
docs = ["markdown>=3.7", "pygments>=2.18", "pillow>=11.0", "pypdf>=5"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uengram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
