[project]
name = "uengram"
version = "0.1.0"
description = "Deterministic fixed-budget memory for embedded sensor streams"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
cnn = ["torch>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cnn" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uengram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
