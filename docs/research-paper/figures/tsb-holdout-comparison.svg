<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc" color="var(--fg)">
<title id="title">TSB-AD-U holdout comparison</title>
<desc id="desc">Pooled and equal-series AUROC and average precision for an ordinary CNN, MOMENT edge completion, and MOMENT linear resampling with instance statistics. Pooled scores are high because the large Exathlon series dominates; equal-series scores are lower.</desc>
<text x="24" y="30" font-size="20" font-weight="700" fill="currentColor">TSB-AD-U: pooled versus equal-series metrics</text>
<text x="24" y="54" font-size="13" fill="var(--muted)">Six frozen series; equal-series averages prevent long series from hiding weak domains</text>
<g stroke="var(--border)" stroke-width="1">
  <path d="M76 342H426M76 72V342M514 342H864M514 72V342"/>
  <path d="M76 207H426M514 207H864"/>
</g>
<g fill="var(--muted)" font-size="12" text-anchor="end">
  <text x="68" y="346">0.60</text><text x="68" y="211">0.775</text><text x="68" y="76">0.95</text>
  <text x="506" y="346">0.40</text><text x="506" y="211">0.63</text><text x="506" y="76">0.86</text>
</g>
<g fill="currentColor" font-size="14" font-weight="700" text-anchor="middle">
  <text x="251" y="392">AUROC</text><text x="689" y="392">Average precision</text>
</g>
<g fill="var(--muted)" font-size="12" text-anchor="middle">
  <text x="140" y="365">pooled</text><text x="250" y="365">equal-series</text><text x="360" y="365">pooled</text>
  <text x="578" y="365">pooled</text><text x="688" y="365">equal-series</text><text x="798" y="365">pooled</text>
</g>
<g fill="var(--c1)">
  <rect x="106" y="102" width="24" height="240"/><rect x="216" y="305" width="24" height="37"/>
  <rect x="544" y="84" width="24" height="258"/><rect x="654" y="325" width="24" height="17"/>
</g>
<g fill="var(--c2)">
  <rect x="136" y="104" width="24" height="238"/><rect x="246" y="316" width="24" height="26"/>
  <rect x="574" y="84" width="24" height="258"/><rect x="684" y="319" width="24" height="23"/>
</g>
<g fill="var(--c3)">
  <rect x="166" y="98" width="24" height="244"/><rect x="276" y="318" width="24" height="24"/>
  <rect x="604" y="87" width="24" height="255"/><rect x="714" y="327" width="24" height="15"/>
</g>
<g fill="currentColor" font-size="12">
  <rect x="250" y="414" width="14" height="14" fill="var(--c1)"/><text x="270" y="426">ordinary CNN</text>
  <rect x="385" y="414" width="14" height="14" fill="var(--c2)"/><text x="405" y="426">MOMENT edge</text>
  <rect x="520" y="414" width="14" height="14" fill="var(--c3)"/><text x="540" y="426">MOMENT linear + stats</text>
</g>
<text x="24" y="450" font-size="12" fill="var(--muted)">Pooled AUROC slightly favors linear + statistics; equal-series AUROC favors the local CNN. AP rankings also disagree.</text>
</svg>
